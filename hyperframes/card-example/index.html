<!doctype html>
<html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:P;src:url(Poppins-Bold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{width:100%;height:100%;position:relative;font-family:P}
#card{position:absolute;left:90px;top:900px;width:900px;padding:40px;border-radius:44px;
 background:rgba(14,16,34,.82);backdrop-filter:blur(18px);border:4px solid #FFE500;color:#fff;
 box-shadow:0 30px 60px rgba(0,0,0,.45)}
#card h2{font-size:58px;letter-spacing:-.01em}
.row{display:flex;gap:18px;margin-top:26px}
.t{flex:1;background:#23263d;border-radius:26px;padding:22px;font-size:30px;text-align:center}
.pill{display:inline-block;background:#FFE500;color:#000;border-radius:99px;padding:10px 28px;font-size:34px;margin-top:26px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
 <div id="card" class="clip" data-start="0" data-duration="3" data-track-index="0">
  <h2>APPLE INTELLIGENCE</h2>
  <div class="row"><div class="t">Siri</div><div class="t">Writing</div><div class="t">Visual AI</div><div class="t">Cleanup</div></div>
  <div class="pill">RUNS ON ALIBABA'S QWEN 🧠</div>
 </div>
</div>
<script>
const tl = gsap.timeline({paused:true});
tl.from("#card",{y:120,scale:.85,opacity:0,duration:.35,ease:"back.out(1.6)"},0)
  .from(".t",{y:40,opacity:0,scale:.6,duration:.25,ease:"back.out(2)",stagger:.18},.25)
  .from(".pill",{scale:0,duration:.3,ease:"back.out(2.2)"},1.2)
  .to("#card",{y:-60,opacity:0,scale:.9,duration:.25,ease:"power2.in"},2.7);
window.__timelines["main"]=tl; tl.seek(0);
</script></body></html>
